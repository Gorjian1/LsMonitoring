name: LS Monitoring CI/CD

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ./global.json

      - name: Restore
        run: dotnet restore LsMonitoring.sln

      - name: Build
        run: dotnet build LsMonitoring.sln --no-restore -c Release

      - name: Test
        run: dotnet test LsMonitoring.sln --no-build -c Release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-latest

    env:
      PROJECT_PATH: LsMonitoring.Avalonia/LsMonitoring.Avalonia.csproj
      RUNTIME_ID: win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ./global.json

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publish app
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT_PATH `
            -c Release `
            -r $env:RUNTIME_ID `
            --self-contained true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=${{ steps.version.outputs.value }} `
            -o artifacts/publish/$env:RUNTIME_ID
          Get-ChildItem artifacts/publish/$env:RUNTIME_ID -Filter *.pdb -File | Remove-Item -Force

      - name: Create portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Compress-Archive `
            -Path artifacts/publish/$env:RUNTIME_ID/* `
            -DestinationPath artifacts/release/LsMonitoring-$env:RUNTIME_ID-portable.zip `
            -Force

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Download previous release for delta packages
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force artifacts/previous | Out-Null
          vpk download github `
            --repoUrl https://github.com/Gorjian1/LsMonitoring `
            --token ${{ github.token }} `
            --outputDir artifacts/previous

      - name: Pack with Velopack
        shell: pwsh
        run: |
          $previousDir = if (Test-Path artifacts/previous/RELEASES-win) { "artifacts/previous" } else { $null }
          $packArgs = @(
            "pack",
            "--packId", "LsMonitoring",
            "--packVersion", "${{ steps.version.outputs.value }}",
            "--packDir", "artifacts/publish/$env:RUNTIME_ID",
            "--mainExe", "LsMonitoring.Avalonia.exe",
            "--outputDir", "artifacts/release",
            "--packTitle", "LS Monitoring"
          )
          if ($previousDir) {
            $packArgs += "--previousDir", $previousDir
          }
          vpk @packArgs

      - name: Setup Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android alerts APK
        shell: pwsh
        env:
          LS_ALERTS_KEYSTORE_B64: ${{ secrets.LS_ALERTS_KEYSTORE_B64 }}
          LS_ALERTS_KEYSTORE_PASSWORD: ${{ secrets.LS_ALERTS_KEYSTORE_PASSWORD }}
          LS_ALERTS_KEY_ALIAS: ${{ secrets.LS_ALERTS_KEY_ALIAS }}
          LS_ALERTS_KEY_PASSWORD: ${{ secrets.LS_ALERTS_KEY_PASSWORD }}
        run: |
          $missing = @()
          foreach ($name in @(
            "LS_ALERTS_KEYSTORE_B64",
            "LS_ALERTS_KEYSTORE_PASSWORD",
            "LS_ALERTS_KEY_ALIAS",
            "LS_ALERTS_KEY_PASSWORD"
          )) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) {
              $missing += $name
            }
          }

          if ($missing.Count -gt 0) {
            throw "Missing Android signing secrets: $($missing -join ', ')"
          }

          $version = "${{ steps.version.outputs.value }}"
          $versionParts = $version.Split(".") | ForEach-Object { [int]$_ }
          while ($versionParts.Count -lt 3) {
            $versionParts += 0
          }
          $versionCode = ($versionParts[0] * 10000) + ($versionParts[1] * 100) + $versionParts[2]
          $keystorePath = "${{ github.workspace }}\LsMonitoring.MobileAlerts\release-key.jks"
          [IO.File]::WriteAllBytes($keystorePath, [Convert]::FromBase64String($env:LS_ALERTS_KEYSTORE_B64))
          $env:LS_ALERTS_KEYSTORE_FILE = $keystorePath

          Push-Location LsMonitoring.MobileAlerts
          gradle --no-daemon assembleRelease "-PversionName=$version" "-PversionCode=$versionCode"
          Pop-Location

          Copy-Item `
            LsMonitoring.MobileAlerts/app/build/outputs/apk/release/app-release.apk `
            artifacts/release/ls-alerts-$version.apk
          Copy-Item `
            LsMonitoring.MobileAlerts/app/build/outputs/apk/release/app-release.apk `
            artifacts/release/ls-alerts-latest.apk

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $expected = @(
            "artifacts/release/LsMonitoring-Setup.exe",
            "artifacts/release/LsMonitoring-$version-full.nupkg",
            "artifacts/release/LsMonitoring-$env:RUNTIME_ID-portable.zip",
            "artifacts/release/ls-alerts-$version.apk",
            "artifacts/release/ls-alerts-latest.apk"
          )

          foreach ($path in $expected) {
            if (!(Test-Path $path)) {
              throw "Missing release artifact: $path"
            }

            $item = Get-Item $path
            if ($item.Length -le 0) {
              throw "Empty release artifact: $path"
            }
          }

          $apk = "artifacts/release/ls-alerts-$version.apk"
          $apksignerCommand = Get-Command apksigner.bat -ErrorAction SilentlyContinue
          if ($null -eq $apksignerCommand) {
            $apksignerCommand = Get-Command apksigner -ErrorAction SilentlyContinue
          }

          $apksignerPath = $apksignerCommand?.Source
          if ([string]::IsNullOrWhiteSpace($apksignerPath)) {
            $sdkRoots = @($env:ANDROID_HOME, $env:ANDROID_SDK_ROOT) |
              Where-Object { ![string]::IsNullOrWhiteSpace($_) } |
              Select-Object -Unique
            foreach ($sdkRoot in $sdkRoots) {
              $candidate = Get-ChildItem `
                -Path (Join-Path $sdkRoot "build-tools") `
                -Filter apksigner.bat `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending |
                Select-Object -First 1
              if ($candidate) {
                $apksignerPath = $candidate.FullName
                break
              }
            }
          }

          if ([string]::IsNullOrWhiteSpace($apksignerPath)) {
            throw "apksigner was not found in PATH or Android SDK build-tools"
          }

          & $apksignerPath verify --print-certs $apk

      - name: Publish release via Velopack
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vpk upload github `
            --repoUrl https://github.com/Gorjian1/LsMonitoring `
            --token ${{ github.token }} `
            --tag ${{ github.ref_name }} `
            --outputDir artifacts/release `
            --releaseName "LS Monitoring ${{ github.ref_name }}"

      - name: Upload extra artifacts to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.value }}"
          gh release upload "${{ github.ref_name }}" `
            "artifacts/release/ls-alerts-$version.apk" `
            "artifacts/release/ls-alerts-latest.apk" `
            "artifacts/release/LsMonitoring-$env:RUNTIME_ID-portable.zip"
