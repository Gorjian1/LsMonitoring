name: dotnet

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore dotnet/LsMonitoring.sln

      - name: Build
        run: dotnet build dotnet/LsMonitoring.sln --no-restore -c Release

      - name: Test
        run: dotnet test dotnet/LsMonitoring.sln --no-build -c Release
