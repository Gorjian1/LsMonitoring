name: LS Monitoring CI/CD

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ./global.json

      - name: Restore
        run: dotnet restore LsMonitoring.sln

      - name: Build
        run: dotnet build LsMonitoring.sln --no-restore -c Release

      - name: Test
        run: dotnet test LsMonitoring.sln --no-build -c Release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-latest

    env:
      PROJECT_PATH: LsMonitoring.Avalonia/LsMonitoring.Avalonia.csproj
      RUNTIME_ID: win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ./global.json

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained app
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT_PATH `
            -c Release `
            -r $env:RUNTIME_ID `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=${{ steps.version.outputs.value }} `
            -o artifacts/publish/$env:RUNTIME_ID
          Get-ChildItem artifacts/publish/$env:RUNTIME_ID -Filter *.pdb -File | Remove-Item -Force

      - name: Create portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Copy-Item `
            artifacts/publish/$env:RUNTIME_ID/LsMonitoring.Avalonia.exe `
            artifacts/release/LsMonitoring-$env:RUNTIME_ID.exe
          Compress-Archive `
            -Path artifacts/publish/$env:RUNTIME_ID/* `
            -DestinationPath artifacts/release/LsMonitoring-$env:RUNTIME_ID-portable.zip `
            -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            build/installer/LsMonitoring.iss `
            /DAppVersion=${{ steps.version.outputs.value }} `
            /DPublishDir="${{ github.workspace }}\artifacts\publish\$env:RUNTIME_ID" `
            /DOutputDir="${{ github.workspace }}\artifacts\release"

      - name: Setup Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android alerts APK
        shell: pwsh
        env:
          LS_ALERTS_KEYSTORE_B64: ${{ secrets.LS_ALERTS_KEYSTORE_B64 }}
          LS_ALERTS_KEYSTORE_PASSWORD: ${{ secrets.LS_ALERTS_KEYSTORE_PASSWORD }}
          LS_ALERTS_KEY_ALIAS: ${{ secrets.LS_ALERTS_KEY_ALIAS }}
          LS_ALERTS_KEY_PASSWORD: ${{ secrets.LS_ALERTS_KEY_PASSWORD }}
        run: |
          $missing = @()
          foreach ($name in @(
            "LS_ALERTS_KEYSTORE_B64",
            "LS_ALERTS_KEYSTORE_PASSWORD",
            "LS_ALERTS_KEY_ALIAS",
            "LS_ALERTS_KEY_PASSWORD"
          )) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) {
              $missing += $name
            }
          }

          if ($missing.Count -gt 0) {
            throw "Missing Android signing secrets: $($missing -join ', ')"
          }

          $version = "${{ steps.version.outputs.value }}"
          $versionParts = $version.Split(".") | ForEach-Object { [int]$_ }
          while ($versionParts.Count -lt 3) {
            $versionParts += 0
          }
          $versionCode = ($versionParts[0] * 10000) + ($versionParts[1] * 100) + $versionParts[2]
          $keystorePath = "${{ github.workspace }}\LsMonitoring.MobileAlerts\release-key.jks"
          [IO.File]::WriteAllBytes($keystorePath, [Convert]::FromBase64String($env:LS_ALERTS_KEYSTORE_B64))
          $env:LS_ALERTS_KEYSTORE_FILE = $keystorePath

          Push-Location LsMonitoring.MobileAlerts
          gradle --no-daemon assembleRelease "-PversionName=$version" "-PversionCode=$versionCode"
          Pop-Location

          Copy-Item `
            LsMonitoring.MobileAlerts/app/build/outputs/apk/release/app-release.apk `
            artifacts/release/ls-alerts-$version.apk

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $expected = @(
            "artifacts/release/LsMonitoring-$env:RUNTIME_ID.exe",
            "artifacts/release/LsMonitoring-$env:RUNTIME_ID-portable.zip",
            "artifacts/release/LsMonitoringSetup-$env:RUNTIME_ID.exe",
            "artifacts/release/ls-alerts-$version.apk"
          )

          foreach ($path in $expected) {
            if (!(Test-Path $path)) {
              throw "Missing release artifact: $path"
            }

            $item = Get-Item $path
            if ($item.Length -le 0) {
              throw "Empty release artifact: $path"
            }
          }

          $exe = Get-Item "artifacts/release/LsMonitoring-$env:RUNTIME_ID.exe"
          $fileVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe.FullName)
          if ($fileVersion.ProductVersion -notlike "$version*") {
            throw "Desktop version mismatch: expected $version, got $($fileVersion.ProductVersion)"
          }

          $apk = "artifacts/release/ls-alerts-$version.apk"
          $apksigner = Get-Command apksigner.bat -ErrorAction SilentlyContinue
          if ($null -eq $apksigner) {
            $apksigner = Get-Command apksigner -ErrorAction SilentlyContinue
          }
          if ($null -eq $apksigner) {
            throw "apksigner was not found in PATH"
          }

          & $apksigner.Source verify --print-certs $apk

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            artifacts/release/* `
            --title "LS Monitoring ${{ github.ref_name }}" `
            --notes "Автоматическая сборка LS Monitoring ${{ github.ref_name }}."
