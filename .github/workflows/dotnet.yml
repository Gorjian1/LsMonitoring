name: LS Monitoring CI/CD

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ./global.json

      - name: Restore
        run: dotnet restore LsMonitoring.sln

      - name: Build
        run: dotnet build LsMonitoring.sln --no-restore -c Release

      - name: Test
        run: dotnet test LsMonitoring.sln --no-build -c Release

  release-desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-latest

    env:
      PROJECT_PATH: LsMonitoring.Avalonia/LsMonitoring.Avalonia.csproj
      RUNTIME_ID: win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ./global.json

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publish app
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT_PATH `
            -c Release `
            -r $env:RUNTIME_ID `
            --self-contained true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=${{ steps.version.outputs.value }} `
            -o artifacts/publish/$env:RUNTIME_ID
          Get-ChildItem artifacts/publish/$env:RUNTIME_ID -Filter *.pdb -File | Remove-Item -Force

      - name: Bundle gotify-server.exe with the app
        shell: pwsh
        run: |
          $url = "https://github.com/gotify/server/releases/latest/download/gotify-windows-amd64.exe.zip"
          $zip = "artifacts/gotify-download.zip"
          $extract = "artifacts/gotify-extracted"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          New-Item -ItemType Directory -Force $extract | Out-Null
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $exe = Get-ChildItem $extract -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "No .exe found inside Gotify zip" }
          Copy-Item $exe.FullName "artifacts/publish/$env:RUNTIME_ID/gotify-server.exe" -Force
          Remove-Item $zip, $extract -Recurse -Force

      - name: Create portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Compress-Archive `
            -Path artifacts/publish/$env:RUNTIME_ID/* `
            -DestinationPath artifacts/release/LsMonitoring-$env:RUNTIME_ID-portable.zip `
            -Force

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Download previous release for delta packages
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force artifacts/previous | Out-Null
          vpk download github `
            --repoUrl https://github.com/Gorjian1/LsMonitoring `
            --token ${{ github.token }} `
            --outputDir artifacts/previous

      - name: Pack with Velopack
        shell: pwsh
        run: |
          $previousDir = if (Test-Path artifacts/previous/RELEASES-win) { "artifacts/previous" } else { $null }
          $packArgs = @(
            "pack",
            "--packId", "LsMonitoring",
            "--packVersion", "${{ steps.version.outputs.value }}",
            "--packDir", "artifacts/publish/$env:RUNTIME_ID",
            "--mainExe", "LsMonitoring.Avalonia.exe",
            "--outputDir", "artifacts/release",
            "--packTitle", "LS Monitoring"
          )
          if ($previousDir) {
            $packArgs += "--previousDir", $previousDir
          }
          vpk @packArgs

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts
          path: artifacts/release/*

  release-android:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "value=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Android alerts APK
        shell: bash
        env:
          LS_ALERTS_KEYSTORE_B64: ${{ secrets.LS_ALERTS_KEYSTORE_B64 }}
          LS_ALERTS_KEYSTORE_PASSWORD: ${{ secrets.LS_ALERTS_KEYSTORE_PASSWORD }}
          LS_ALERTS_KEY_ALIAS: ${{ secrets.LS_ALERTS_KEY_ALIAS }}
          LS_ALERTS_KEY_PASSWORD: ${{ secrets.LS_ALERTS_KEY_PASSWORD }}
        run: |
          missing=()
          for name in LS_ALERTS_KEYSTORE_B64 LS_ALERTS_KEYSTORE_PASSWORD LS_ALERTS_KEY_ALIAS LS_ALERTS_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing Android signing secrets: ${missing[*]}"
            exit 1
          fi

          VERSION="${{ steps.version.outputs.value }}"
          IFS='.' read -r -a parts <<< "$VERSION"
          v1=${parts[0]:-0}
          v2=${parts[1]:-0}
          v3=${parts[2]:-0}
          VERSION_CODE=$(( v1 * 10000 + v2 * 100 + v3 ))

          KEYSTORE_PATH="${{ github.workspace }}/LsMonitoring.MobileAlerts/release-key.jks"
          printf "%s" "$LS_ALERTS_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          export LS_ALERTS_KEYSTORE_FILE="$KEYSTORE_PATH"

          cd LsMonitoring.MobileAlerts
          gradle --no-daemon assembleRelease -PversionName="$VERSION" -PversionCode="$VERSION_CODE"
          cd ..

          mkdir -p artifacts/release
          cp LsMonitoring.MobileAlerts/app/build/outputs/apk/release/app-release.apk artifacts/release/ls-alerts-$VERSION.apk
          cp LsMonitoring.MobileAlerts/app/build/outputs/apk/release/app-release.apk artifacts/release/ls-alerts-latest.apk

          # Verify signature
          APKSIGNER_PATH=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER_PATH" ]; then
            $APKSIGNER_PATH verify --print-certs artifacts/release/ls-alerts-$VERSION.apk
          else
            echo "apksigner not found, skipping signature verification"
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: artifacts/release/ls-alerts-*.apk

  publish-release:
    needs: [release-desktop, release-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ./global.json

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "value=$VERSION" >> $GITHUB_OUTPUT

      - name: Download Desktop Artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-artifacts
          path: artifacts/release

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: artifacts/release

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Publish release via Velopack
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vpk upload github \
            --repoUrl https://github.com/Gorjian1/LsMonitoring \
            --token ${{ github.token }} \
            --tag ${{ github.ref_name }} \
            --outputDir artifacts/release \
            --releaseName "LS Monitoring ${{ github.ref_name }}" \
            --publish

      - name: Upload extra artifacts to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          gh release upload "${{ github.ref_name }}" \
            "artifacts/release/ls-alerts-$VERSION.apk" \
            "artifacts/release/ls-alerts-latest.apk" \
            "artifacts/release/LsMonitoring-win-x64-portable.zip"

      - name: Set release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ github.ref_name }}" --notes "Сборка Ls Monitoring" --draft=false
