name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0"
        required: true
        default: "v0.1.0"
      prerelease:
        description: "Mark as prerelease"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

env:
  APP_NAME: LS-Monitoring
  SOLUTION_PATH: LsMonitoring.sln
  PROJECT_PATH: LsMonitoring.Avalonia/LsMonitoring.Avalonia.csproj

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ./global.json

      - name: Restore dependencies
        run: dotnet restore $env:SOLUTION_PATH

      - name: Run tests
        run: dotnet test $env:SOLUTION_PATH --configuration Release --no-restore

      - name: Publish app
        run: >
          dotnet publish $env:PROJECT_PATH
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output ./publish/win-x64

      - name: Create ZIP archive
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          $archiveName = "$env:APP_NAME-$version-win-x64.zip"

          New-Item -ItemType Directory -Force -Path ./artifacts | Out-Null
          Compress-Archive -Path ./publish/win-x64/* -DestinationPath ./artifacts/$archiveName -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.event.inputs.version }}"
          $archive = Get-ChildItem ./artifacts/*.zip | Select-Object -First 1
          $isPrerelease = "${{ github.event.inputs.prerelease }}"

          $args = @(
            "release", "create", $version,
            $archive.FullName,
            "--title", "$env:APP_NAME $version",
            "--generate-notes",
            "--target", "${{ github.sha }}"
          )

          if ($isPrerelease -eq "true") {
            $args += "--prerelease"
          }

          gh @args
